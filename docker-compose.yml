# Local development stack: the Rust fusion-api plus the minimal dashboard.
# `docker compose up` then open http://localhost:5173.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8088:8088"
    environment:
      - FUSION_BIND=0.0.0.0:8088
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://api:8088
    depends_on:
      api:
        condition: service_started
