# Assured Edge Fusion and Confidence Fabric — Rust workspace
#
# Edge-first assurance/fusion layer. The proprietary core lives in
# fusion-core, confidence-engine, provenance-store, and replay.
# Everything else (ingestion adapters, schemas, API) is meant to be
# replaceable around that core.
[workspace]
resolver = "2"
members = [
    "crates/shared-types",
    "crates/provenance-store",
    "crates/confidence-engine",
    "crates/fusion-core",
    "crates/ingestion",
    "crates/replay",
    "services/api",
    "tests/integration",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Proprietary"
rust-version = "1.75"

[workspace.dependencies]
# Third-party
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "fs", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Internal crates
shared-types = { path = "crates/shared-types" }
provenance-store = { path = "crates/provenance-store" }
confidence-engine = { path = "crates/confidence-engine" }
fusion-core = { path = "crates/fusion-core" }
ingestion = { path = "crates/ingestion" }
replay = { path = "crates/replay" }

[profile.release]
lto = "thin"
codegen-units = 1
